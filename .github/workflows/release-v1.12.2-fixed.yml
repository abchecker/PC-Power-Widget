name: Release v1.12.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.12.2-fixed.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.12.2 patch
        run: git apply tools/v1.12.2.patch

      - name: Update README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('- CPU usage\n- GPU usage', '- CPU usage\n- real CPU temperature\n- GPU usage\n- real GPU temperature')
          s = s.replace('releases/download/v1.12.1/PC_Power_Widget_v1.12.1.zip', 'releases/download/v1.12.2/PC_Power_Widget_v1.12.2.zip')
          if '## v1.12.2' not in s:
              s += '\n\n## v1.12.2\n\n- Real CPU temperature below CPU usage.\n- Real GPU temperature below GPU usage.\n- Temperature text is smaller; compact widget stays 455 × 48.\n- Missing sensors show `--°C`; temperatures are never estimated.\n'
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify source
        run: |
          grep -q 'CompactCPUTemp' payload/RAMUsageWidget.ps1
          grep -q 'CompactGPUTemp' payload/RAMUsageWidget.ps1
          grep -q 'temperature.gpu' payload/RAMUsageWidget.ps1
          grep -q 'Widget version: 1.12.2 SHARE' payload/RAMUsageWidget.ps1

      - name: Commit source update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payload/RAMUsageWidget.ps1 README.md
          git commit -m 'v1.12.2: real CPU and GPU temperatures'
          git push

      - name: Build installer ZIP
        run: zip -r PC_Power_Widget_v1.12.2.zip INSTALL.bat INSTALL.ps1 payload README.md LICENSE -x 'payload/lib/*'

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.12.2 PC_Power_Widget_v1.12.2.zip --title 'PC Power Widget v1.12.2' --notes 'Adds real CPU and GPU temperatures below their usage percentages. Temperature text is smaller; compact size remains 455x48. Missing sensors show --°C.'
