name: Build public source and release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble main widget source
        shell: bash
        run: |
          set -euo pipefail
          if ls payload/RAMUsageWidget.ps1.part* >/dev/null 2>&1; then
            cat payload/RAMUsageWidget.ps1.part* > payload/RAMUsageWidget.ps1
            rm payload/RAMUsageWidget.ps1.part*
          fi

      - name: Commit assembled source
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- payload; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add payload/RAMUsageWidget.ps1 payload/RAMUsageWidget.ps1.part* 2>/dev/null || true
            git add -u payload
            git commit -m "Assemble public widget source"
            git push origin HEAD:main
          fi

      - name: Build install ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f PC_Power_Widget_v1.12.1.zip
          zip -r PC_Power_Widget_v1.12.1.zip \
            INSTALL.bat INSTALL.ps1 README.md LICENSE payload \
            -x 'payload/lib/*.dll' 'payload/lib/*.exe' 'payload/lib/*.zip' 'payload/lib/LibreHardwareMonitor/*'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.12.1 >/dev/null 2>&1; then
            gh release upload v1.12.1 PC_Power_Widget_v1.12.1.zip --clobber
          else
            gh release create v1.12.1 PC_Power_Widget_v1.12.1.zip \
              --target main \
              --title "PC Power Widget v1.12.1" \
              --notes "Initial public release. Lightweight Windows overlay for FPS, CPU/GPU/RAM load, estimated power draw, electricity cost, weather, and persistent usage history."
          fi
