name: Publish v1.12.4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.12.4 source patch
        shell: bash
        run: |
          echo '[... ELLIPSIZATION ...]' | base64 -d > /tmp/v1124.patch
          git apply --check /tmp/v1124.patch
          git apply /tmp/v1124.patch

      - name: Commit source update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload/RAMUsageWidget.ps1 INSTALL.ps1
          git commit -m "Release v1.12.4 temperatures and PawnIO support"
          git push

      - name: Build release ZIP
        shell: bash
        run: |
          mkdir -p release/PC_Power_Widget_v1.12.4
          cp INSTALL.bat INSTALL.ps1 README.md LICENSE release/PC_Power_Widget_v1.12.4/
          cp -R payload release/PC_Power_Widget_v1.12.4/
          cd release
          zip -r ../PC_Power_Widget_v1.12.4.zip PC_Power_Widget_v1.12.4

      - name: Create v1.12.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.12.4 PC_Power_Widget_v1.12.4.zip \
            --title "PC Power Widget v1.12.4" \
            --notes "Adds real CPU/GPU temperatures, board temperature support, ASUS B660-A sensor mapping, and optional official PawnIO 2.2.0 installation when CPU low-level telemetry is unavailable."
