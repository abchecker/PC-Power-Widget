name: Publish v1.12.4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Run v1.12.4 publisher'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Transform source to v1.12.4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('payload/RAMUsageWidget.ps1')
          s = p.read_text(encoding='utf-8-sig')

          # Enable CPU/GPU plus motherboard SuperIO/controller/memory telemetry.
          if 'IsMotherboardEnabled = $true' not in s:
              old = '''        $script:Computer = New-Object LibreHardwareMonitor.Hardware.Computer
                  $script:Computer.IsCpuEnabled = $true
                  $script:Computer.IsGpuEnabled = $true
                  $script:Computer.Open()'''
              new = '''        $script:Computer = New-Object LibreHardwareMonitor.Hardware.Computer
                  $script:Computer.IsCpuEnabled = $true
                  $script:Computer.IsGpuEnabled = $true
                  $script:Computer.IsMotherboardEnabled = $true
                  $script:Computer.IsControllerEnabled = $true
                  $script:Computer.IsMemoryEnabled = $true
                  $script:Computer.Open()'''
              if old not in s:
                  raise SystemExit('LHM enable block not found')
              s = s.replace(old, new, 1)

          # Named-only lookup for board/EC sensors. This never guesses by hottest sensor.
          if 'function Get-NamedSensorValue' not in s:
              helper = r'''
          function Get-NamedSensorValue {
              param(
                  [string[]]$HardwareTypes,
                  [string]$SensorType,
                  [string[]]$PreferredNames
              )

              if (-not $script:LhmOK) { return $null }
              $candidates = @()

              foreach ($hw in (Get-AllHardware)) {
                  $ht = [string]$hw.HardwareType
                  if ($HardwareTypes -notcontains $ht) { continue }
                  foreach ($sensor in $hw.Sensors) {
                      if ([string]$sensor.SensorType -ne $SensorType) { continue }
                      if ($null -eq $sensor.Value) { continue }
                      $candidates += $sensor
                  }
              }

              foreach ($wanted in $PreferredNames) {
                  $exact = $candidates | Where-Object { ([string]$_.Name).Trim() -ieq $wanted } | Select-Object -First 1
                  if ($exact) { return [double]$exact.Value }
              }
              foreach ($wanted in $PreferredNames) {
                  $match = $candidates | Where-Object { ([string]$_.Name) -like "*$wanted*" } | Select-Object -First 1
                  if ($match) { return [double]$match.Value }
              }
              return $null
          }

          '''
              marker = '# PresentMon FPS capture.'
              if marker not in s:
                  raise SystemExit('FPS marker not found')
              s = s.replace(marker, helper + marker, 1)

          # Add board temperature below RAM in compact mode.
          if 'CompactMBTemp' not in s:
              old_ram = '''                    <Border Grid.Column="3" BorderBrush="#2CFFFFFF" BorderThickness="0,0,1,0">
                                  <TextBlock x:Name="CompactRAM" Text="RAM --%" Foreground="White"
                                             FontFamily="Segoe UI" FontWeight="Bold" FontSize="14"
                                             TextAlignment="Center" VerticalAlignment="Center" TextWrapping="NoWrap"/>
                              </Border>'''
              new_ram = '''                    <Border Grid.Column="3" BorderBrush="#2CFFFFFF" BorderThickness="0,0,1,0">
                                  <StackPanel VerticalAlignment="Center">
                                      <TextBlock x:Name="CompactRAM" Text="RAM --%" Foreground="White"
                                                 FontFamily="Segoe UI" FontWeight="Bold" FontSize="13.5"
                                                 TextAlignment="Center" TextWrapping="NoWrap" LineHeight="15"/>
                                      <TextBlock x:Name="CompactMBTemp" Text="BD --°C" Foreground="#AFFFFFFF"
                                                 FontFamily="Segoe UI" FontWeight="SemiBold" FontSize="8.5"
                                                 TextAlignment="Center" TextWrapping="NoWrap" LineHeight="9"/>
                                  </StackPanel>
                              </Border>'''
              if old_ram not in s:
                  raise SystemExit('RAM compact block not found')
              s = s.replace(old_ram, new_ram, 1)

              ref_old = '$compactRAM = $window.FindName("CompactRAM")\n$compactPower = $window.FindName("CompactPower")'
              ref_new = '$compactRAM = $window.FindName("CompactRAM")\n$compactMBTemp = $window.FindName("CompactMBTemp")\n$compactPower = $window.FindName("CompactPower")'
              if ref_old not in s:
                  raise SystemExit('RAM control refs not found')
              s = s.replace(ref_old, ref_new, 1)

          # Add CPU SuperIO fallback, board sensor lookup and confirmed ASUS mapping.
          if '$mbTempActual = Get-NamedSensorValue' not in s:
              anchor = '$gpuTempActual = Get-SensorValue @("GpuNvidia","GpuAmd","GpuIntel") "Temperature" @("GPU Core","Core","GPU Temperature","GPU")\n'
              if anchor not in s:
                  raise SystemExit('GPU temperature anchor not found')
              sensor_logic = r'''

              # Some systems expose CPU temperature through SuperIO/EC if direct package telemetry is unavailable.
              if ($null -eq $cpuTempActual) {
                  $cpuTempActual = Get-NamedSensorValue @("Motherboard","SuperIO","EmbeddedController") "Temperature" @(
                      "CPU Package","CPU Core","CPU","CPU Temp","CPU Temperature","CPU Socket","CPU (PECI)","PECI","CPUTIN"
                  )
              }

              $mbTempActual = Get-NamedSensorValue @("Motherboard","SuperIO","EmbeddedController") "Temperature" @(
                  "Motherboard","Mainboard","System","System 1","System #1","Board","MB","SYSTIN"
              )

              # Confirmed mapping from a real sensor dump for this exact board.
              # Nuvoton NCT6798D Temperature #2 is shown as BD (board/system), never as RAM temperature.
              if ($null -eq $mbTempActual) {
                  $isKnownAsusB660 = $false
                  foreach ($hw in (Get-AllHardware)) {
                      if ([string]$hw.HardwareType -eq "Motherboard" -and
                          ([string]$hw.Name) -ieq "ASUS ROG STRIX B660-A GAMING WIFI D4") {
                          $isKnownAsusB660 = $true
                          break
                      }
                  }
                  if ($isKnownAsusB660) {
                      $mbTempActual = Get-NamedSensorValue @("SuperIO") "Temperature" @("Temperature #2")
                  }
              }
          '''
              s = s.replace(anchor, anchor + sensor_logic, 1)

          if '$compactMBTemp.Text' not in s:
              ui_anchor = '''    if ($null -eq $gpuTempActual) {
                  $compactGPUTemp.Text = "--°C"
              } else {
                  $compactGPUTemp.Text = ("{0:0}°C" -f [double]$gpuTempActual)
              }
          '''
              if ui_anchor not in s:
                  raise SystemExit('GPU temp UI block not found')
              board_ui = '''
              if ($null -eq $mbTempActual) {
                  $compactMBTemp.Text = "BD --°C"
              } else {
                  $compactMBTemp.Text = ("BD {0:0}°C" -f [double]$mbTempActual)
              }
          '''
              s = s.replace(ui_anchor, ui_anchor + board_ui, 1)

          s = re.sub(r'Widget version: [0-9.]+(?: SHARE)?', 'Widget version: 1.12.4 SHARE', s)

          required = [
              'IsMotherboardEnabled = $true', 'IsControllerEnabled = $true',
              'function Get-NamedSensorValue', 'CompactMBTemp',
              'ASUS ROG STRIX B660-A GAMING WIFI D4', 'Temperature #2',
              'Widget version: 1.12.4 SHARE'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Source verification failed: ' + ', '.join(missing))
          p.write_text(s, encoding='utf-8-sig')

          # Installer: detect low-level CPU telemetry and offer official PawnIO only when needed.
          ip = Path('INSTALL.ps1')
          i = ip.read_text(encoding='utf-8-sig')
          if 'PawnIO_setup_2.2.0.exe' not in i:
              for a,b in [('[1/6]','[1/7]'),('[2/6]','[2/7]'),('[3/6]','[3/7]'),('[4/6]','[4/7]'),('[5/6]','[6/7]'),('[6/6]','[7/7]')]:
                  i = i.replace(a,b)

              pawnio = r'''
          Write-Host "[5/7] Checking CPU hardware sensor access..."

          function Test-CpuLowLevelSensors {
              param([string]$DllPath)
              if (-not (Test-Path $DllPath)) { return $false }
              try {
                  Add-Type -Path $DllPath -ErrorAction SilentlyContinue
                  $testComputer = New-Object LibreHardwareMonitor.Hardware.Computer
                  $testComputer.IsCpuEnabled = $true
                  $testComputer.IsMotherboardEnabled = $true
                  $testComputer.IsControllerEnabled = $true
                  $testComputer.Open()
                  foreach ($hw in $testComputer.Hardware) {
                      try { $hw.Update() } catch {}
                      foreach ($sub in $hw.SubHardware) { try { $sub.Update() } catch {} }
                  }
                  Start-Sleep -Milliseconds 600
                  $ok = $false
                  foreach ($hw in $testComputer.Hardware) {
                      if ([string]$hw.HardwareType -eq "Cpu") {
                          try { $hw.Update() } catch {}
                          foreach ($sensor in $hw.Sensors) {
                              if ([string]$sensor.SensorType -eq "Temperature" -and $null -ne $sensor.Value) { $ok = $true }
                              if ([string]$sensor.SensorType -eq "Power" -and ([string]$sensor.Name) -like "*Package*" -and
                                  $null -ne $sensor.Value -and [double]$sensor.Value -gt 0.1) { $ok = $true }
                          }
                      }
                  }
                  $testComputer.Close()
                  return $ok
              } catch { return $false }
          }

          $cpuSensorsOk = Test-CpuLowLevelSensors -DllPath $LhmDll
          if (-not $cpuSensorsOk) {
              Write-Host ""
              Write-Host "CPU temperature/power sensors are not readable on this PC." -ForegroundColor Yellow
              Write-Host "PawnIO can provide the low-level hardware access LibreHardwareMonitor needs."
              Write-Host "PawnIO is an independent GPL-licensed driver from namazso/pawnio.eu."
              $pawnAnswer = Read-Host "Install official signed PawnIO 2.2.0? [Y/n]"
              if ([string]::IsNullOrWhiteSpace($pawnAnswer) -or $pawnAnswer.Trim().ToLowerInvariant() -in @("y","yes")) {
                  $PawnIoSetup = Join-Path $env:TEMP "PawnIO_setup_2.2.0.exe"
                  $PawnIoUrl = "https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe"
                  $PawnIoSha256 = "1f519a22e47187f70a1379a48ca604981c4fcf694f4e65b734aaa74a9fba3032"
                  Write-Host "      Downloading official PawnIO 2.2.0..."
                  Invoke-WebRequest -UseBasicParsing -Uri $PawnIoUrl -OutFile $PawnIoSetup
                  $pawnHash = (Get-FileHash $PawnIoSetup -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($pawnHash -ne $PawnIoSha256) {
                      Remove-Item $PawnIoSetup -Force -ErrorAction SilentlyContinue
                      throw "PawnIO download verification failed."
                  }
                  Write-Host "      Installing official signed PawnIO driver..."
                  $pawnProc = Start-Process -FilePath $PawnIoSetup -ArgumentList "-install -silent" -Wait -PassThru
                  $pawnExit = $pawnProc.ExitCode
                  Remove-Item $PawnIoSetup -Force -ErrorAction SilentlyContinue
                  if ($pawnExit -eq 0) {
                      Write-Host "      PawnIO installed." -ForegroundColor Green
                  } elseif ($pawnExit -eq 3010) {
                      Write-Host "      PawnIO installed; Windows restart required for CPU sensors." -ForegroundColor Yellow
                  } else {
                      Write-Host "      PawnIO returned code $pawnExit; widget installation will continue." -ForegroundColor Yellow
                  }
              } else {
                  Write-Host "      PawnIO skipped. CPU temperature/power may remain unavailable." -ForegroundColor Yellow
              }
          } else {
              Write-Host "      CPU low-level sensors already readable. PawnIO not needed."
          }

          '''
              anchor = 'Write-Host "[6/7] Enabling Windows autostart..."'
              if anchor not in i:
                  raise SystemExit('Autostart anchor not found after renumber')
              i = i.replace(anchor, pawnio + anchor, 1)

          required_i = ['[5/7] Checking CPU hardware sensor access', 'PawnIO_setup_2.2.0.exe',
                        '1f519a22e47187f70a1379a48ca604981c4fcf694f4e65b734aaa74a9fba3032',
                        '-install -silent']
          missing_i = [x for x in required_i if x not in i]
          if missing_i:
              raise SystemExit('Installer verification failed: ' + ', '.join(missing_i))
          ip.write_text(i, encoding='utf-8-sig')
          PY

      - name: Commit source update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload/RAMUsageWidget.ps1 INSTALL.ps1
          git commit -m "Release v1.12.4 temperatures and PawnIO support"
          git push

      - name: Build release ZIP
        shell: bash
        run: |
          mkdir -p release/PC_Power_Widget_v1.12.4
          cp INSTALL.bat INSTALL.ps1 README.md LICENSE THIRD_PARTY.md release/PC_Power_Widget_v1.12.4/
          cp -R payload release/PC_Power_Widget_v1.12.4/
          cd release
          zip -r ../PC_Power_Widget_v1.12.4.zip PC_Power_Widget_v1.12.4

      - name: Create v1.12.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.12.4 PC_Power_Widget_v1.12.4.zip \
            --title "PC Power Widget v1.12.4" \
            --notes "Adds real CPU/GPU temperatures, board temperature support, ASUS B660-A sensor mapping, and optional official PawnIO 2.2.0 installation when CPU low-level telemetry is unavailable."
